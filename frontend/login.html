<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login - AutoTrack</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
<div class="auth-page">
  <div class="auth-container">
    <div class="auth-logo"><i class="fas fa-car-side" style="color:var(--primary);margin-right:8px"></i>Auto<span>Track</span></div>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-user" onclick="switchTab('user')">User Login</button>
      <button class="auth-tab" id="tab-admin" onclick="switchTab('admin')">Admin Login</button>
    </div>

    <!-- User Login -->
    <div id="user-form" class="auth-form">
      <h2>Welcome Back</h2>
      <p>Sign in to manage your vehicles and maintenance records</p>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" id="u-email" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative">
          <input class="form-input" id="u-password" type="password" placeholder="Your password" style="padding-right:44px">
          <button onclick="togglePwd('u-password',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-light)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button class="btn-auth" onclick="loginUser()"><i class="fas fa-sign-in-alt"></i> Sign In</button>
      <div class="auth-footer">Don't have an account? <a href="signup.html">Sign Up</a></div>
    </div>

    <!-- Admin Login -->
    <div id="admin-form" class="auth-form" style="display:none">
      <h2>Admin Portal</h2>
      <p>Access the administration dashboard</p>
      <div style="background:rgba(192,57,43,0.08);border:1px solid rgba(192,57,43,0.2);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:0.82rem;color:var(--primary)">
        <i class="fas fa-info-circle"></i> Admin: <strong>admin@gmail.com</strong> / <strong>@Admin69</strong>
      </div>
      <div class="form-group">
        <label class="form-label">Admin Email</label>
        <input class="form-input" id="a-email" type="email" placeholder="admin@gmail.com" value="admin@gmail.com">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative">
          <input class="form-input" id="a-password" type="password" placeholder="Admin password" style="padding-right:44px">
          <button onclick="togglePwd('a-password',this)" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-light)"><i class="fas fa-eye"></i></button>
        </div>
      </div>
      <button class="btn-auth" onclick="loginAdmin()" style="background:var(--secondary-light)"><i class="fas fa-user-shield"></i> Admin Sign In</button>
    </div>

    <div style="text-align:center;margin-top:20px">
      <a href="index.html" style="font-size:0.85rem;color:var(--text-light)"><i class="fas fa-arrow-left"></i> Back to Home</a>
    </div>
  </div>
</div>

<script src="js/api.js"></script>
<script>
  // Redirect if already logged in
  if (isLoggedIn()) {
    const u = getUser();
    window.location.href = u?.role === 'ADMIN' ? 'admin-dashboard.html' : 'dashboard.html';
  }

  function switchTab(tab) {
    document.getElementById('tab-user').classList.toggle('active', tab === 'user');
    document.getElementById('tab-admin').classList.toggle('active', tab === 'admin');
    document.getElementById('user-form').style.display  = tab === 'user'  ? 'block' : 'none';
    document.getElementById('admin-form').style.display = tab === 'admin' ? 'block' : 'none';
  }

  function togglePwd(id, btn) {
    const inp = document.getElementById(id);
    const show = inp.type === 'password';
    inp.type = show ? 'text' : 'password';
    btn.innerHTML = `<i class="fas fa-eye${show ? '-slash' : ''}"></i>`;
  }

  async function loginUser() {
    const email    = document.getElementById('u-email').value.trim();
    const password = document.getElementById('u-password').value;
    if (!email || !password) { toast('Please enter email and password', 'error'); return; }
    try {
      const data = await Auth.login({ email, password });
      if (data.role === 'ADMIN') { toast('Please use Admin Login tab', 'error'); return; }
      Auth.saveSession(data);
      toast('Welcome back, ' + data.name + '!');
      setTimeout(() => window.location.href = 'dashboard.html', 800);
    } catch (e) { toast(e.message, 'error'); }
  }

  async function loginAdmin() {
    const email    = document.getElementById('a-email').value.trim();
    const password = document.getElementById('a-password').value;
    if (!email || !password) { toast('Please enter credentials', 'error'); return; }
    try {
      const data = await Auth.login({ email, password });
      if (data.role !== 'ADMIN') { toast('Not an admin account', 'error'); return; }
      Auth.saveSession(data);
      toast('Admin login successful!');
      setTimeout(() => window.location.href = 'admin-dashboard.html', 800);
    } catch (e) { toast(e.message, 'error'); }
  }

  // Enter key support
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      if (document.getElementById('user-form').style.display !== 'none') loginUser();
      else loginAdmin();
    }
  });
</script>
</body>
</html>
